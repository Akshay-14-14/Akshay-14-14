<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Akshay S — AI Full Stack Automation Cloud</title>
<desc id="desc">Animated neon cinematic developer header.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020303"/>
    <stop offset=".55" stop-color="#061a13"/>
    <stop offset="1" stop-color="#001b15"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#00ff88" stop-opacity=".28"/>
    <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  <style>
    .mono{font-family:monospace}
    .title{font:700 74px monospace;letter-spacing:8px;fill:#fff}
    .sub{font:600 22px monospace;letter-spacing:4px;fill:#00ff88}
    .small{font:500 17px monospace;fill:#d7fff0}
    .line{stroke:#00ff88;stroke-width:2;opacity:.55}
  </style>
</defs>
<rect width="1600" height="420" rx="28" fill="url(#bg)"/>
<circle cx="1270" cy="190" r="250" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="r" values="210;280;210" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- cinematic horizon -->
<path d="M0 330 Q230 270 420 325 T800 310 T1200 325 T1600 295 V420 H0Z" fill="#03110c"/>
<path d="M0 325 Q250 285 450 330 T850 315 T1250 330 T1600 300" fill="none" stroke="#00ff88" stroke-width="2" opacity=".4"/>

<!-- grid -->
<g opacity=".16">
  <path d="M0 350H1600 M0 380H1600 M200 420L600 330 M500 420L720 330 M800 420L840 330 M1100 420L960 330 M1400 420L1080 330" stroke="#00ff88"/>
</g>

<!-- floating particles -->
<g fill="#00ff88">
  <circle cx="1040" cy="90" r="3"><animate attributeName="cy" values="90;70;90" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1120" cy="130" r="2"><animate attributeName="cy" values="130;110;130" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="1210" cy="75" r="2"><animate attributeName="cy" values="75;105;75" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="1320" cy="120" r="3"><animate attributeName="cy" values="120;85;120" dur="2.5s" repeatCount="indefinite"/></circle>
</g>

<!-- terminal panel -->
<rect x="1060" y="55" width="420" height="190" rx="18" fill="#020807" stroke="#00ff88" opacity=".95"/>
<circle cx="1090" cy="82" r="6" fill="#00ff88"/>
<circle cx="1112" cy="82" r="6" fill="#0b7650"/>
<circle cx="1134" cy="82" r="6" fill="#073b2b"/>
<text x="1090" y="120" class="small">$ whoami</text>
<text x="1090" y="148" class="sub">AKSHAY_S</text>
<text x="1090" y="181" class="small">$ status</text>
<text x="1090" y="211" class="small">BUILDING INTELLIGENT SYSTEMS_</text>
<rect x="1090" y="225" width="10" height="20" fill="#00ff88">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>

<text x="90" y="150" class="title">AKSHAY S</text>
<text x="94" y="196" class="sub">AI  •  FULL-STACK  •  AUTOMATION  •  CLOUD</text>
<line x1="94" y1="218" x2="780" y2="218" class="line"/>
<text x="94" y="255" class="small">Building practical software with AI, automation &amp; modern web technology.</text>
<text x="94" y="290" class="small">LEARN  →  BUILD  →  BREAK  →  IMPROVE  →  SHIP</text>

<!-- scanline -->
<rect x="0" y="0" width="1600" height="3" fill="#00ff88" opacity=".45">
  <animate attributeName="y" values="0;417;0" dur="7s" repeatCount="indefinite"/>
</rect>
</svg>